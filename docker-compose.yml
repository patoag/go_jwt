services:
  # Base de datos PostgreSQL
  postgres:
    image: postgres:15-alpine
    container_name: go-jwt-postgres
    environment:
      POSTGRES_DB: go_jwt_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - go-jwt-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis
  redis:
    image: redis:7-alpine
    container_name: go-jwt-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - go-jwt-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Aplicación Go
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: go-jwt-app
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=postgres123
      - DB_NAME=go_jwt_db
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=
      - REDIS_DB=0
      - JWT_SECRET=mi-super-secreto-jwt-key-2024
      - JWT_EXPIRATION_HOURS=24
      - PORT=8080
      - GIN_MODE=debug
      - CORS_ALLOWED_ORIGINS=*
      - RATE_LIMIT_REQUESTS=100
      - RATE_LIMIT_WINDOW=60
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - go-jwt-network
    volumes:
      - .:/app
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  go-jwt-network:
    driver: bridge
